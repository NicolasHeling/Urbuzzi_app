version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CORE_SERVICE_URL=http://core-service:3002
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urbuzzi-network

  auth-service:
    build: ./auth-service
    env_file: .env
    environment:
      - DB_HOST=postgres-urbuzzi
      - DB_PORT=5432
      - DB_NAME=auth_db
    depends_on:
      postgres-urbuzzi:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - urbuzzi-network

  core-service:
    build: ./core-service
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      - DB_HOST=postgres-urbuzzi
      - DB_PORT=5432
      - DB_NAME=core_db
    volumes:
      - core_uploads:/usr/src/app/uploads
    depends_on:
      postgres-urbuzzi:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - urbuzzi-network

  postgres-urbuzzi:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - urbuzzi-network

volumes:
  pgdata:
  core_uploads:

networks:
  urbuzzi-network:
    driver: bridge
