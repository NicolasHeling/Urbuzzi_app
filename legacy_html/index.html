<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interativo de Lotes | Urbuzzi</title>
  <meta name="description" content="Gestão visual de loteamentos: disponíveis, reservados, em aprovação e vendidos.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <h1>Mapa Interativo</h1>
      <p class="subtitle">Loteamento Biopark · Gleba 1 · <span id="lotCount">16</span> lotes mapeados</p>
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="map-layout">
      <div class="map-container">
        <svg id="mapSvg" class="map-svg-area" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div class="detail-panel" id="detailPanel">
        <div class="detail-panel-header">
          <h3>Lote selecionado</h3>
        </div>
        <div class="detail-panel-body" id="detailBody">
          <p style="color: var(--text-muted); font-size: 0.875rem;">Clique em um lote no mapa para ver os detalhes.</p>
        </div>
        <div class="detail-actions" id="detailActions" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
