name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_core_service:
    name: Core Service Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend/core-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/core-service/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Run Unit Tests
        run: npm test

  test_auth_service:
    name: Auth Service Build & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend/auth-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/auth-service/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

  test_gateway:
    name: Gateway Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend/gateway

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/gateway/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Gateway
        run: npm run build
