name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./urbuzzi_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Dummy .env
        run: cp .env.example .env || echo "API_URL_WEB=http://localhost:3000" > .env

      - name: Verify Formatting
        run: flutter format --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test --coverage
